<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- NAV -->
  <nav>
    <div class="nav-left">
      <span class="nav-logo-icon">✦</span>
      <span class="nav-logo-text">Kanban</span>
    </div>
    <div class="nav-center">
      <div class="progress-wrap">
        <span class="progress-label">Progress</span>
        <div class="progress-track"><div class="progress-fill" id="overall-progress"></div></div>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
    </div>
    <div class="nav-right">
      <div class="search-wrap">
        <span class="search-icon">&#8981;</span>
        <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off" />
      </div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme">&#9728;</button>
      <button class="icon-btn" id="export-btn" title="Export JSON">&#8595;</button>
      <button class="icon-btn" id="import-btn" title="Import JSON">&#8593;</button>
      <input type="file" id="import-file" accept=".json" style="display:none" />
      <button class="add-task-nav-btn" id="toggle-modal">+ New Task</button>
    </div>
  </nav>
  <!-- BOARD -->
  <main>
    <section class="board">

      <div id="todo" class="task-column">

        <div class="col-header">
          <div class="col-header-left">
            <span class="col-dot todo-dot"></span>
            <span class="col-title">To Do</span>
          </div>
          <span class="count-badge todo-badge" id="count-todo">0</span>
        </div>
        <div class="wip-bar" id="wip-todo" style="display:none">
          <span class="wip-warn">&#9888; WIP limit reached</span>
        </div>
        <div class="tasks-list" id="list-todo">
          <div class="empty-state"><span>&#128203;</span><p>No tasks yet</p></div>
        </div>
      </div>

      <div id="progress" class="task-column">
        <div class="col-header">
          <div class="col-header-left">
            <span class="col-dot progress-dot"></span>
            <span class="col-title">In Progress</span>
          </div>
          <span class="count-badge progress-badge" id="count-progress">0</span>
        </div>
        <div class="wip-bar" id="wip-progress" style="display:none">
          <span class="wip-warn">&#9888; WIP limit (3) reached</span>
        </div>
        <div class="tasks-list" id="list-progress">
          <div class="empty-state"><span>&#9889;</span><p>Nothing in progress</p></div>
        </div>
      </div>

      <div id="done" class="task-column">
        <div class="col-header">
          <div class="col-header-left">
            <span class="col-dot done-dot"></span>
            <span class="col-title">Done</span>
          </div>
          <span class="count-badge done-badge" id="count-done">0</span>
        </div>
        <div class="wip-bar" id="wip-done" style="display:none"></div>
        <div class="tasks-list" id="list-done">
          <div class="empty-state"><span>&#9989;</span><p>Completed tasks</p></div>
        </div>
      </div>

    </section>
  </main>

  <!-- add/delete -->
  <div class="modal" id="task-modal">
    <div class="modal-bg" id="modal-bg"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title-text">New Task</h2>
        <button class="modal-close-btn" id="modal-close">&#10005;</button>
      </div>
      <input type="text" id="task-title-input" placeholder="Task title..." autocomplete="off" />
      <textarea id="task-desc-input" placeholder="Description (optional)..." rows="3"></textarea>
      <div class="modal-row">
        <div class="field-group">
          <label>Priority</label>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field-group">
          <label>Due Date</label>
          <input type="date" id="task-due" />
        </div>
      </div>
      <div class="field-group">
        <label>Labels</label>
        <div class="label-chips">
          <label class="chip"><input type="checkbox" value="bug" /><span>Bug</span></label>
          <label class="chip"><input type="checkbox" value="feature" /><span>Feature</span></label>
          <label class="chip"><input type="checkbox" value="design" /><span>Design</span></label>
          <label class="chip"><input type="checkbox" value="docs" /><span>Docs</span></label>
          <label class="chip"><input type="checkbox" value="review" /><span>Review</span></label>
        </div>
      </div>
      <input type="hidden" id="edit-task-id" value="" />
      <button class="modal-submit-btn" id="modal-submit">Add Task</button>
    </div>
  </div>

  <!-- undo  -->
  <div class="toast" id="undo-toast">
    <span id="toast-msg">Task deleted</span>
    <button id="undo-btn">Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
